<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Normie Tumbleweed</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 800px;
      height: 200px;
      background: transparent;
      overflow: hidden;
      position: relative;
    }

    @keyframes normie-tumbleweed {
      0%    { transform: translateX(-400px) translateY(0)     rotate(0deg); }
      12.5% { transform: translateX(-200px) translateY(-80px) rotate(180deg); }
      25%   { transform: translateX(0px)    translateY(0)     rotate(360deg); }
      37.5% { transform: translateX(200px)  translateY(-80px) rotate(540deg); }
      50%   { transform: translateX(400px)  translateY(0)     rotate(720deg); }
      62.5% { transform: translateX(600px)  translateY(-80px) rotate(900deg); }
      75%   { transform: translateX(800px)  translateY(0)     rotate(1080deg); }
      87.5% { transform: translateX(1000px) translateY(-80px) rotate(1260deg); }
      100%  { transform: translateX(1200px) translateY(0)     rotate(1440deg); }
    }

    .normie {
      position: absolute;
      bottom: 20px;
      left: 0;
      width: 120px;
      height: 120px;
      animation: normie-tumbleweed 8s linear infinite;
    }

    .normie img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="normie">
    <img
      src="https://rktztfvkjctixyymdkyj.supabase.co/storage/v1/object/public/gallery/1778111457367-logo_normie_4.png"
      alt="Normie"
      crossorigin="anonymous"
    />
  </div>
</body>
</html>
