version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
      npm-development:
        dependency-type: development
    ignore:
      # Tiptap is pinned intentionally; upgrade manually with --legacy-peer-deps.
      - dependency-name: "@tiptap/*"
      # Major versions (Next, TypeScript, ESLint, Vitest, ...) are deliberate,
      # planned upgrades — not grouped Dependabot bumps. Security advisories
      # still override this when severity requires it.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
